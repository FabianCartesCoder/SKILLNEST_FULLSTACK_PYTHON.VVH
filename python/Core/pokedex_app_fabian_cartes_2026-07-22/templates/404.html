<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon no encontrado</title>
    <!-- Iconos FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tu archivo CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="error-body">

    <main class="error-card">
        <h1 class="error-title">¡Oh no!</h1>

        <!-- Muestra el mensaje dinámico (ej: No pudimos encontrar información sobre "agumon" en nuestra Pokédex.) -->
        <p class="error-message">{{ mensaje }}</p>

        <div class="error-badge">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span>Pokémon no encontrado</span>
        </div>

        <p class="error-subtext">
            Tal vez este Pokémon aún no ha sido descubierto, o quizás has escrito mal su nombre.
        </p>

        <a href="{{ url_for('mostrar_todos_pokemon') }}" class="btn-home">
            <i class="fa-solid fa-house"></i> Volver a la Pokédex
        </a>
    </main>

</body>

</html>
