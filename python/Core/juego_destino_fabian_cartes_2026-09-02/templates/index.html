<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Juego del Destino</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="card">
        <div class="card-header">
            <div class="icon-circle moon-icon">🌙</div>
            <h1>El Juego del Destino</h1>
            <p class="subtitle">Descubre qué te depara el futuro</p>
        </div>
        
        <form action="/enviar" method="POST" class="card-body">
            {% with messages = get_flashed_messages() %}
              {% if messages %}
                <div class="alert-error">
                  {% for message in messages %}
                    <p>{{ message }}</p>
                  {% endfor %}
                </div>
              {% endif %}
            {% endwith %}

            <div class="form-group">
                <div class="input-container">
                    <i class="fa-solid fa-user icon"></i>
                    <input type="text" name="nombre" placeholder="Tu nombre" required autocomplete="off">
                </div>
            </div>

            <div class="form-group">
                <div class="input-container">
                    <i class="fa-solid fa-calendar-days icon"></i>
                    <input type="number" name="edad" placeholder="Tu edad" min="1" max="120" required>
                </div>
            </div>

            <div class="form-group">
                <div class="input-container">
                    <i class="fa-solid fa-palette icon"></i>
                    <input type="text" name="color" placeholder="Tu color favorito" required autocomplete="off">
                </div>
                <small class="help-text">Ej. rojo, azul, verde, morado, amarillo...</small>
            </div>

            <div class="form-group">
                <div class="input-container">
                    <i class="fa-solid fa-paw icon"></i>
                    <input type="text" name="animal" placeholder="Tu animal favorito" required autocomplete="off">
                </div>
                <small class="help-text">Ej. perro, gato, águila, león, delfín...</small>
            </div>

            <div class="crystal-ball-container">
                <div class="crystal-ball"></div>
            </div>

            <button type="submit" class="btn-main">
                ✏️ Revelar mi destino
            </button>
        </form>
    </div>
</body>
</html>
