<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usuario #{{ usuario.id }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="container main-wrapper py-3" style="max-width: 600px;">

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <div class="custom-card">
        <div class="custom-card-header bg-warning text-dark">
            <h4 class="mb-0 fw-bold"><i class="bi bi-pencil-square me-2"></i>Modificar Registro #{{ usuario.id }}</h4>
            <small>Actualice los campos que considere necesarios.</small>
        </div>
        <div class="p-4">
            <form action="{{ url_for('actualizar_usuario', id=usuario.id) }}" method="POST">
                <div class="mb-3">
                    <label for="nombre" class="form-label fw-semibold">Nombre</label>
                    <input type="text" class="form-control" id="nombre" name="nombre" value="{{ usuario.nombre }}" required>
                </div>
                <div class="mb-3">
                    <label for="apellido" class="form-label fw-semibold">Apellido</label>
                    <input type="text" class="form-control" id="apellido" name="apellido" value="{{ usuario.apellido }}" required>
                </div>
                <div class="mb-4">
                    <label for="email" class="form-label fw-semibold">Correo Electrónico</label>
                    <input type="email" class="form-control" id="email" name="email" value="{{ usuario.email }}" required>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a href="{{ url_for('ver_usuario', id=usuario.id) }}" class="btn btn-light border">Cancelar</a>
                    <button type="submit" class="btn btn-success px-4">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
