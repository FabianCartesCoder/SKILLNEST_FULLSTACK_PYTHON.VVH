<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ver Usuario</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

<div class="container py-5">

    <div class="detail-card">

        <div class="page-header">

            <div>

                <h1>
                    Usuario {{ usr_data.id }}
                </h1>

                <p class="text-muted">
                    Información completa del usr_data.
                </p>

            </div>

        </div>


        

        <div class="user-detail">

            <p>
                <strong>Nombre Completo:</strong>
                {{ usr_data.nombre }} {{ usr_data.apellido }}
            </p>


            <p>
                <strong>E-mail:</strong>
                {{ usr_data.email }}
            </p>


            <p>
                <strong>Fecha Creación:</strong>
                {{ usr_data.created_at }}
            </p>


            <p>
                <strong>Fecha Actualización:</strong>
                {{ usr_data.updated_at }}
            </p>

        </div>


        

        <div class="mt-4">

            <a
                href="{{ url_for('editar_usuario', id=usr_data.id) }}"
                class="btn btn-warning"
            >
                Editar
            </a>


            <a
                href="{{ url_for('borrar_usuario', id=usr_data.id) }}"
                class="btn btn-danger"
            >
                Borrar
            </a>


            <a
                href="{{ url_for('usr_list') }}"
                class="btn btn-outline-secondary"
            >
                Volver
            </a>

        </div>

    </div>

</div>

</body>

</html>
