<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi primera plantilla Flask</title>

</head>

<body>

    <h1>¡Bienvenido {{ nombre }}!</h1>

    <p>Estás estudiando: {{ curso }}</p>
    <p>Vives en: {{ ciudad }}</p>
    <p>El año es: {{ año }}</p>

    {% if profesor %}
    <p>Bienvenido profesor.</p>
    {% else %}
    <p> Bienvenido alumno.</p>
    {% endif %}

    <ul>

        {% for tecnologia in tecnologias %}

        <li>{{ tecnologia }}</li>

        {% endfor %}

    </ul>

</body>

</html>
